name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (unit, race, vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
  desktop:
    name: Native UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Resolve desktop dependencies
        working-directory: desktop
        run: go mod tidy
      - name: Compile desktop app
        working-directory: desktop
        run: go build -o SyslogTester .
      - name: Validate desktop sources
        working-directory: desktop
        run: go vet ./...
